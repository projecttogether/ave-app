version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    ports:
      # Bind to loopback only — this dev database uses default credentials
      # and must not be reachable from the network
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ave_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: